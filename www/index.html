<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#1b1d2a;--mu:#6b7080;--pr:#4f46e5;--pr2:#7c3aed;--ok:#16a34a;--bad:#dc2626;--bd:#e3e5f0}
@media(prefers-color-scheme:dark){:root{--bg:#0f1020;--card:#1a1b30;--tx:#eef0ff;--mu:#9a9fc0;--bd:#2a2c4a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,"Segoe UI",Tahoma,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:auto}
header{padding:14px 20px;background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border-radius:0 0 22px 22px}
header h1{margin:0;font-size:21px}header small{opacity:.85}
main{flex:1;overflow:auto;padding:16px}
nav{display:flex;background:var(--card);border-top:1px solid var(--bd)}
nav button{flex:1;padding:8px 0;background:none;border:0;color:var(--mu);font:inherit;font-size:12px}
nav button.on{color:var(--pr);font-weight:700}nav b{display:block;font-size:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:12px}
.btn{border:0;border-radius:14px;padding:12px 16px;font:inherit;font-weight:700;background:var(--pr);color:#fff}
.btn.g{background:var(--card);color:var(--pr);border:1px solid var(--bd)}.btn.ok{background:var(--ok)}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
.slots,.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:ltr;margin:16px 0}
.slot,.tile{width:44px;height:52px;border-radius:12px;display:grid;place-items:center;font-size:24px;font-weight:700;padding:0}
.slot{border:2px dashed var(--bd)}.slot.f{border:2px solid var(--pr)}
.slot.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.slot.bad{background:var(--bad);color:#fff;border-color:var(--bad);animation:sh .4s}
.tile{background:var(--card);border:1px solid var(--bd);box-shadow:0 3px 0 var(--bd);color:var(--tx)}.tile:disabled{opacity:.15}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr);transition:width .3s}
.big{font-size:42px;font-weight:800;direction:ltr;text-align:center;letter-spacing:2px}
.fb{text-align:center;animation:pop .3s}.ltr{direction:ltr;text-align:left}.mu{color:var(--mu)}
textarea,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;z-index:9}
.tag{font-size:11px;padding:2px 8px;border-radius:9px;background:var(--bd);color:var(--mu)}
.w{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--bd)}.w b{flex:1;direction:ltr;text-align:left}
.ic{background:none;border:0;font-size:20px;padding:4px 8px}
.ti{width:100%;font-size:22px;text-align:center;letter-spacing:2px;padding:12px;border-radius:12px;border:2px solid var(--bd);background:var(--bg);color:var(--tx)}.btn:disabled{opacity:.4}small{opacity:.7}
.arm{direction:rtl;text-align:center;font-size:20px;line-height:1.7;margin:10px 0}.arm .tag{font-size:12px}
.ipa{direction:ltr;text-align:center;font-size:22px;color:var(--pr);min-height:30px;margin:2px 0}.sn{border-top:1px solid var(--bd);padding:8px 0;text-align:right}.sar{direction:rtl;font-size:18px;line-height:1.7}.sen{direction:ltr;text-align:left;font-size:13px}
</style>
</head>
<body>
<div id="app">
<header><h1>SpellMaster</h1><small>متقن الإملاء – يعمل بدون إنترنت</small></header>
<main id="main"></main>
<nav><button data-t="p"><b>🎯</b>تمرين</button><button data-t="l"><b>🧠</b>حفظ</button><button data-t="w"><b>📚</b>كلماتي</button><button data-t="m"><b>📊</b>إحصائيات</button></nav>
</div>
<input type="file" id="fi" accept=".json" hidden>
<script>
const $=s=>document.querySelector(s),dn=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5);
const PR=['أحسنت!','ممتاز!','رائع!','صحيح!','عمل جميل!'],LV=['🔤 رتّب الحروف','🔡 أكمل بعد الحرف الأول','⌨️ اكتب من الصوت فقط'];
const EN={dbl:'حرف مضاعف (مثل ll / ss)',miss:'حرف ناقص',extra:'حرف زائد',swap:'تبديل مكان حرفين',vow:'خلط بين حروف العلة',sub:'حرف خاطئ'};
let S={words:[],streak:0,last:0,log:{},rate:.85,ret:.9,err:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem('sm1')||'{}'))}catch(e){}
S.err=S.err||{};S.ret=S.ret||.9;
const save=()=>{try{localStorage.setItem('sm1',JSON.stringify(S))}catch(e){}};
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let tab='p',ses=null,cur=null,lc=null,voice=null,lh=[];
/* ---------- الصوت ---------- */
const NT=()=>{const C=window.Capacitor;if(!(C&&C.nativePromise&&C.isNativePlatform&&C.isNativePlatform()))return null;return NT.p||(NT.p={speak:o=>C.nativePromise('TextToSpeech','speak',o),isLanguageSupported:o=>C.nativePromise('TextToSpeech','isLanguageSupported',o),getSupportedLanguages:()=>C.nativePromise('TextToSpeech','getSupportedLanguages',{})})};let nok=null,LANGX='en-US';
const errm=e=>String((e&&(e.message||e.errorMessage))||e||''),VD=[1500,2000,3000,4000],LC=['en-US','en-GB','en'];
async function chkVoice(){const T=NT();if(!T)return;for(const d of VD){await new Promise(r=>setTimeout(r,d));if(nok===true)return;for(const l of LC){let ok=false;try{ok=(await T.isLanguageSupported({lang:l})).supported}catch(e){}if(ok){LANGX=l;nok=true;if(!cur)render();return}}}nok=false;if(!cur)render()}
function pickVoice(){if(NT())return nok===false?null:{name:nok?'صوت الهاتف ('+LANGX+')':'جارٍ فحص صوت الهاتف…',localService:true};try{const v=speechSynthesis.getVoices().filter(x=>/^en/i.test(x.lang));voice=v.find(x=>x.localService&&/en[-_]US/i.test(x.lang))||v.find(x=>x.localService)||v[0]||null}catch(e){}return voice}
try{speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function say(t,r){const T=NT();if(T){T.speak({text:t,lang:LANGX,rate:r||S.rate||.85,pitch:1,volume:1}).then(()=>{if(nok!==true){nok=true;if(!cur)render()}}).catch(e=>{const m=errm(e);if(/not supported/i.test(m)){nok=false;if(!cur)render();toast('الصوت الإنجليزي غير متوفر في محرك النطق')}else if(/initializ/i.test(m))toast('محرك النطق يجهّز نفسه… أعد المحاولة بعد لحظة');else toast('تعذّر النطق: '+m.slice(0,80))});return}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=voice?voice.lang:'en-US';if(voice)u.voice=voice;u.rate=r||S.rate||.85;speechSynthesis.speak(u)}catch(e){}}
const spell=w=>say(w+'. '+[...w].map(c=>c.toUpperCase()).join(', '),.7);
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2200)}
const DC={};let EX={};
const stems=w=>{const r=[],e=(x,y='')=>{if(w.endsWith(x)&&w.length>x.length+1)r.push(w.slice(0,-x.length)+y)};e('ies','y');e('ied','y');e('ily','y');e('es');e('s');e('ed');e('ed','e');e('ing');e('ing','e');e('er');e('er','e');e('est');e('est','e');e('ly');const m=w.match(/^(.*?)(.)\2(ed|ing|er|est)$/);if(m)r.push(m[1]+m[2]);return r};
async function shard(l){if(DC[l])return DC[l];try{DC[l]=await(await fetch('dict/'+l+'.json')).json()}catch(e){DC[l]={}}return DC[l]}
const AC={},AI={},POSAR={'n.':'اسم','v.':'فعل','adj.':'صفة','adv.':'حال','prep.':'حرف جر','conj.':'حرف عطف','pron.':'ضمير','interj.':'تعجب','det.':'محدِّد','num.':'عدد','phr.':'عبارة','prop. n.':'علم','≈':'مستنتَجة – أقل دقة','awn':'مرادفات عربية'};
async function ld(C,l,suf){const k=l+suf;if(C[k])return C[k];try{C[k]=await(await fetch('dict/ar/'+k+'.json')).json()}catch(e){C[k]={}}return C[k]}
async function lookupAr(w){for(const x of [w,...stems(w)]){const d=(await ld(AC,x[0],''))[x];if(Array.isArray(d))return d;const h=(await ld(AI,x[0],'_i'))[x];if(typeof h==='string'){const d2=(await ld(AC,h[0],''))[h];if(Array.isArray(d2))return d2}}return null}
async function arFill(sel,w){let r=await lookupAr(w);if(!r){const s=await lookupS(w);const l=s?[...new Set(s.slice(0,2).flatMap(x=>x[4]||[]))].slice(0,6):[];if(l.length)r=[['awn',l.join('، ')]]}showAr(sel,r)}
function showAr(sel,r){const e=$(sel);if(!e)return;e.innerHTML=r?r.map(x=>`<div>${x[0]?`<span class="tag">${POSAR[x[0]]||x[0]}</span> `:''}<b>${x[1]}</b></div>`).join(''):'<span class="mu" style="font-size:14px">لا توجد ترجمة عربية لهذه الكلمة في القاموس المدمج</span>'}
const SH={},POS2={n:'اسم',v:'فعل',a:'صفة',r:'حال'};
async function lds(d,l){const k=d+l;if(SH[k])return SH[k];try{SH[k]=await(await fetch('dict/'+d+'/'+l+'.json')).json()}catch(e){SH[k]={}}return SH[k]}
async function lookupS(w){for(const x of [w,...stems(w)]){let d=(await lds('s',x[0]))[x];if(Array.isArray(d))return d;const h=(await ld(AI,x[0],'_i'))[x];if(typeof h==='string'){d=(await lds('s',h[0]))[h];if(Array.isArray(d))return d}}return null}
async function lookupP(w){const d=(await lds('p',w[0]))[w];return typeof d==='string'?{a:d[0]==='≈',v:d.replace('≈','').split('|')}:null}
function showS(r){const e=$('#df');if(!e)return;e.innerHTML='<div class="mu" style="font-size:12px;text-align:center">الشرح بالعربية (ترجمة آلية قد تحتوي أخطاء)</div>'+r.map(x=>`<div class="sn"><span class="tag">${POS2[x[0]]||x[0]}</span>${x[4]&&x[4].length?`<div class="sar"><b>${x[4].join('، ')}</b></div>`:''}<div class="sar">${x[2]}</div><div class="sen mu">${x[1]}${x[3]?` — <i>“${x[3]}”</i>`:''}</div></div>`).join('')}
async function lookup(w){for(const x of [w,...stems(w)]){const e=(await shard(x[0]))[x];if(Array.isArray(e))return e}return null}
/* ---------- جدولة FSRS-4.5 مبسّطة ---------- */
const FW=[.4872,1.4003,3.7145,13.8206,5.1618,1.2298,.8975,.031,1.6474,.1367,1.0461,2.1072,.0793,.3246,1.587,.2272,2.8755],FC=19/81,cl=(x,a,b)=>Math.min(b,Math.max(a,x));
function fs(w,g,n){let s=w.s,d=w.d;
if(s==null){s=FW[g-1];d=FW[4]-FW[5]*(g-3)}
else{const R=Math.pow(1+FC*Math.max(0,n-(w.lr==null?n:w.lr))/s,-.5),s0=s;
s=g===1?Math.min(s0,FW[11]*Math.pow(d,-FW[12])*(Math.pow(s0+1,FW[13])-1)*Math.exp(FW[14]*(1-R))):s0*(1+Math.exp(FW[8])*(11-d)*Math.pow(s0,-FW[9])*(Math.exp(FW[10]*(1-R))-1)*(g===2?FW[15]:1)*(g===4?FW[16]:1));
d=FW[7]*FW[4]+(1-FW[7])*(d-FW[6]*(g-3))}
w.s=cl(s,.1,3650);w.d=cl(d,1,10);w.lr=n;
w.due=n+(g===1?1:Math.max(1,Math.round(w.s/FC*(Math.pow(S.ret||.9,-2)-1))))}
const lvl=w=>(w.b||0)<2?0:(w.b||0)<4?1:2,mv=(w,m)=>{w.m=m;w.due=dn();w.k=0;save()};
function grade(w,g){const n=dn(),ok=g>1;w.t=(w.t||0)+1;
if(ok){w.ok=(w.ok||0)+1;w.b=(w.b||0)+1}else{w.bad=(w.bad||0)+1;w.b=0}
if(w.lr!==n)fs(w,g,n);else if(!ok)w.due=n+1;
S.log[n]=(S.log[n]||0)+1;if(S.last!==n){S.streak=S.last===n-1?S.streak+1:1;S.last=n}
let lee=false;if(!ok&&w.bad>=4&&(w.ok||0)<w.bad*2){mv(w,'l');w.lc=1;w.bad=0;w.ok=0;w.s=null;lee=true}
save();return lee}
/* ---------- أجزاء الكلمة وأنماط الخطأ ---------- */
const PF=['un','dis','mis','pre','non','over','under','sub','inter','anti','fore','out','semi','trans','super','re'],SF=['ness','ment','tion','sion','able','ible','less','ful','ing','ous','ive','ity','ize','ise','ly','ed'];
function parts(w){let a='',z='',r=w;const p=PF.filter(x=>r.startsWith(x)&&r.length-x.length>=(x==='re'?5:4)).sort((x,y)=>y.length-x.length)[0];if(p){a=p;r=r.slice(p.length)}
const s=SF.filter(x=>r.endsWith(x)&&r.length-x.length>=4).sort((x,y)=>y.length-x.length)[0];if(s){z=s;r=r.slice(0,-s.length)}
return a||z?[a,r,z].filter(Boolean).join(' + '):''}
const pt=w=>{const p=parts(w);return p?p+' <small>(تقسيم تقريبي)</small>':''};
function cls(w,g){const D=x=>x.replace(/(.)\1/g,'$1');if(g.length!==w.length)return D(g)===D(w)?'dbl':g.length<w.length?'miss':'extra';
const df=[...w].map((c,k)=>c!==g[k]?k:-1).filter(k=>k>=0);
if(df.length===2&&df[1]===df[0]+1&&w[df[0]]===g[df[1]]&&w[df[1]]===g[df[0]])return'swap';
return df.every(k=>'aeiou'.includes(w[k])&&'aeiou'.includes(g[k]))?'vow':'sub'}
const M=h=>{$('#main').innerHTML=h};
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));({p:vP,l:vL,w:vW,m:vM})[tab]()}
/* ---------- التمرين ---------- */
function vP(){if(cur)return vQ();if(ses&&ses.done)return vEnd();
const n=dn(),d=S.words.filter(w=>w.m==='d'),due=d.filter(w=>w.due<=n).length;
M(`${!pickVoice()?'<div class="card" style="border-color:var(--bad)">⚠️ محرك النطق في هاتفك لا يملك صوتاً إنجليزياً. من الإعدادات ← اللغة والإدخال (أو إعدادات إضافية) ← إخراج تحويل النص إلى كلام ← محرك Google ← ⚙️ ← تثبيت بيانات الصوت ← English. (هذا غير «الكتابة بالصوت».)</div>':''}
<div class="card" style="text-align:center"><div class="tag">🔥 ${S.streak} يوم متتالي</div><div class="big" style="font-size:60px">${due}</div><p>${due?'كلمة مستحقة للمراجعة اليوم':d.length?'لا شيء مستحق اليوم 🎉':'لا توجد كلمات إملاء بعد'}</p>
<button class="btn" style="width:100%" data-a="${due?'start':d.length?'force':'goW'}">${due?'ابدأ التمرين':d.length?'تدرّب على أي حال':'أضف كلمات'}</button></div>`)}
function startSession(force){const n=dn();let q=S.words.filter(w=>w.m==='d'&&(force||w.due<=n));q=shuf(q).slice(0,20).map(w=>w.id);if(!q.length)return toast('لا توجد كلمات');ses={q,i:0,ok:0,bad:0,rt:{}};nextQ()}
function nextQ(){if(ses.i>=ses.q.length){cur=null;ses.done=1;return render()}
const w=S.words.find(x=>x.id===ses.q[ses.i]);if(!w||w.m!=='d'){ses.i++;return nextQ()}
const L=[...w.w],lv=lvl(w);cur={w,lv,t0:Date.now(),hint:0,val:''};
if(lv===0){const ex=Math.max(2,Math.ceil(L.length/3)),ext=shuf([...'abcdefghijklmnopqrstuvwxyz'].filter(c=>!L.includes(c))).slice(0,ex);cur.tiles=shuf([...L,...ext]).map(c=>({c}));cur.slots=Array(L.length).fill(-1)}
render();setTimeout(()=>say(w.w),250)}
const chars=c=>c.lv===0?c.slots.map(i=>i<0?'':c.tiles[i].c):[...c.w.w].map((x,k)=>k?(c.val[k-1]||''):x),
guessOf=c=>c.lv===0?chars(c).join(''):c.lv===1?c.w.w[0]+(c.val||''):(c.val||''),
sh=(ch,res)=>ch.map((c,k)=>`<div class="slot ${c?'f':''} ${res?res[k]:''}" ${!res&&cur.lv===0?`data-a="rm" data-k="${k}"`:''}>${c}</div>`).join('');
const fb=c=>`<div class="fb">${c.ok?`<h2 style="color:var(--ok)">✅ ${c.pr}</h2><p class="mu">مراجعتها القادمة بعد ${Math.max(1,c.w.due-dn())} يوم</p>`:`<h2 style="color:var(--bad)">❌ الصحيح:</h2><div class="big">${c.w.w}</div><div class="mu ltr" style="text-align:center">${pt(c.w.w)}</div><p class="mu">كتبت: <span class="ltr">${c.guess}</span></p>${c.leech?'<p>🧩 كلمة عنيدة: نقلتها إلى «الحفظ» لتحفظها ثم تعود للإملاء.</p>':''}<p>✍️ اكتب الكلمة الصحيحة مرة واحدة للمتابعة</p><input id="cp" class="ti" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" dir="ltr">`}<div id="arf" class="arm"></div><div class="row" style="margin-top:10px"><button class="btn g" data-a="sp">🔤 تهجئة</button><button class="btn" id="nxb" data-a="nx" ${c.ok?'':'disabled'}>التالي ›</button></div></div>`;
function vQ(){const c=cur,w=c.w.w;
const body=c.res?`<div class="slots">${sh(c.gch,c.res)}</div>`:c.lv===2?'':`<div class="slots" id="sl">${sh(chars(c),null)}</div>`;
const inp=c.lv===0?`<div class="tiles">${c.tiles.map((t,i)=>`<button class="tile" data-a="pk" data-i="${i}" ${c.slots.includes(i)?'disabled':''}>${t.c}</button>`).join('')}</div>`:`<input id="ti" class="ti" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" dir="ltr" placeholder="${c.lv===1?'أكمل الحروف الباقية':'اكتب الكلمة'}" value="${c.val||''}"><div id="hn" class="mu ltr" style="min-height:24px;margin-top:6px">${c.hint?'تلميح: '+w.slice(0,(c.lv===1?1:0)+c.hint)+'…':''}</div>`;
M(`<div class="bar"><i style="width:${ses.i/ses.q.length*100}%"></i></div><div class="card" style="margin-top:14px;text-align:center"><span class="tag">${LV[c.lv]}</span>
<div class="row" style="margin-top:10px"><button class="btn g" data-a="say">🔊 استمع</button><button class="btn g" data-a="slow">🐢 ببطء</button>${c.lv&&!c.res?'<button class="btn g" data-a="hint">💡 تلميح</button>':''}</div>
${body}${c.res?fb(c):inp+`<div class="row" style="margin-top:10px">${c.lv===0?'<button class="btn g" data-a="clr">مسح</button>':''}<button class="btn" data-a="chk">تحقق ✓</button></div>`}</div>`);
if(c.res)arFill('#arf',w);if(c.lv&&!c.res)setTimeout(()=>{const t=$('#ti');t&&t.focus()},60);if(c.res&&!c.ok)setTimeout(()=>{const t=$('#cp');t&&t.focus()},60)}
function vEnd(){M(`<div class="card fb"><h2>🏁 انتهت الجلسة</h2><p>✅ ${ses.ok} صحيحة · ❌ ${ses.bad} خاطئة</p><p class="mu">الأخطاء ستعود إليك غداً تلقائياً.</p><button class="btn" style="width:100%" data-a="back">رجوع</button></div>`)}
/* ---------- الحفظ ---------- */
function vL(){const l=S.words.filter(w=>w.m==='l');
if(!l.length)return M(`<div class="card" style="text-align:center">لا توجد كلمات للحفظ.<br><br><button class="btn" data-a="goW">أضف كلمات</button></div>`);
if(!l.find(w=>w.id===lc))lc=shuf(l)[0].id;const w=l.find(x=>x.id===lc);
M(`<div class="card" style="text-align:center"><span class="tag">${w.k||0}/3 ✓</span>${w.lc?' <span class="tag">🧩 عنيدة</span>':''}<div class="big" style="margin:18px 0 6px">${w.w}</div><div id="ipa" class="ipa"></div><div class="mu ltr" style="text-align:center">${pt(w.w)}</div><div id="arm" class="arm"></div><div id="df" class="mu ltr" style="min-height:44px;margin-top:8px"></div>
<div class="row"><button class="btn g" data-a="lsay">🔊 استمع</button><button class="btn g" data-a="lslow">🐢 ببطء</button><button class="btn g" data-a="lsp">🔤 تهجئة</button></div><br>
<div class="row"><button class="btn g" data-a="lprev">السابق</button><button class="btn ok" data-a="lok">حفظتها ✓</button><button class="btn g" data-a="lnx">التالي</button></div><br>
<button class="btn g" style="width:100%" data-a="l2d">انقلها إلى الإملاء الآن 🎯</button></div>`);
say(w.w);arFill('#arm',w.w);lookupP(w.w).then(r=>{const e=$('#ipa');if(!e)return;e.innerHTML=r?r.v.map(x=>'/'+x+'/').join('   ')+(r.a?' <small class="mu" style="font-size:11px">≈ نطق تقريبي مولَّد آلياً</small>':''):'<small class="mu" style="font-size:12px">لا يوجد IPA لهذه الكلمة</small>'});lookupS(w.w).then(r=>{if(r)return showS(r);lookup(w.w).then(r=>{const e=$('#df');if(e)e.innerHTML=r?r.map(x=>`<div><b>${x[0]}.</b> ${x[1]}${x[2]?` — <i>“${x[2]}”</i>`:''}</div>`).join(''):'<span>لا يوجد تعريف لهذه الكلمة في القاموس المدمج</span>'})})}
/* ---------- الكلمات والإحصائيات ---------- */
function vW(){M(`<div class="card"><textarea id="nw" rows="4" class="ltr" placeholder="الصق الكلمات: كلمة في كل سطر أو مفصولة بفواصل"></textarea>
<div class="row" style="margin-top:10px"><select id="nm"><option value="d">إملاء</option><option value="l">حفظ</option></select><button class="btn" data-a="add">إضافة</button></div></div>
<div class="card">${S.words.length?S.words.map(w=>`<div class="w"><b>${w.w}</b><span class="tag">${w.m==='l'?'حفظ':'إملاء · م'+(lvl(w)+1)}</span><button class="ic" data-a="wsay" data-id="${w.id}">🔊</button><button class="ic" data-a="wmv" data-id="${w.id}">⇄</button><button class="ic" data-a="wdel" data-id="${w.id}">🗑</button></div>`).join(''):'لا توجد كلمات بعد'}</div>`)}
function vM(){const n=dn(),d=S.words.filter(w=>w.m==='d'),t=d.reduce((a,w)=>a+(w.t||0),0),ok=d.reduce((a,w)=>a+(w.ok||0),0),top=Object.entries(S.err).sort((a,b)=>b[1]-a[1]).slice(0,3);pickVoice();
M(`<div class="card"><div class="row" style="text-align:center"><div><div class="big" style="font-size:28px">🔥${S.streak}</div>أيام</div><div><div class="big" style="font-size:28px">${S.log[n]||0}</div>اليوم</div><div><div class="big" style="font-size:28px">${t?Math.round(ok/t*100):0}%</div>الدقة</div></div></div>
<div class="card">الكلمات: ${S.words.length} (حفظ ${S.words.length-d.length} · إملاء ${d.length}) · مستحقة اليوم: ${d.filter(w=>w.due<=n).length}</div>
<div class="card"><b>🔍 أنماط أخطائك</b>${top.length?top.map(([k,v])=>`<div>${EN[k]||k} — ${v}</div>`).join(''):'<div class="mu">لا أخطاء بعد 👌</div>'}</div>
<div class="card"><b>🧠 نسبة التذكّر المستهدفة:</b> <span id="rv">${Math.round(S.ret*100)}%</span><br><input type="range" id="rr" min="80" max="95" value="${Math.round(S.ret*100)}" style="width:100%"><div class="mu">أعلى = مراجعات أكثر وحفظ أقوى. المعتمد 90%.</div></div>
<div class="card"><b>الصوت:</b> ${voice?'✅ '+voice.name+(voice.localService?' (محلي – بدون إنترنت)':' ⚠️ قد يحتاج إنترنت'):'⚠️ لا يوجد صوت إنجليزي في محرك النطق – ثبّته من إعدادات الهاتف ← إخراج تحويل النص إلى كلام'}<br><br>السرعة <input type="range" id="rt" min=".4" max="1.1" step=".05" value="${S.rate}"> <button class="btn g" data-a="test">جرّب</button> <button class="btn g" data-a="diag">فحص</button><div id="dg" class="mu ltr" style="margin-top:8px;font-size:13px"></div></div>
<div class="card row"><button class="btn g" data-a="exp">تصدير</button><button class="btn g" data-a="imp">استيراد</button><button class="btn g" data-a="rst" style="color:var(--bad)">مسح الكل</button></div><div class="mu" style="font-size:11px;text-align:center">المعاني الإنجليزية: Princeton WordNet 3.1 · المعاني العربية: koreader-dicts (en-ar وar-en) المبني على ويكاموس وArabic WordNet وPrinceton WordNet — CC BY-SA 4.0 · الشرح: Open English WordNet 2024 وArabic WordNet 4.1 (CC BY 4.0) · IPA: ipa-dict (MIT)</div>`)}
/* ---------- الأحداث ---------- */
document.addEventListener('click',e=>{
const nb=e.target.closest('nav button');if(nb){tab=nb.dataset.t;return render()}
const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id,W=()=>S.words.find(x=>x.id===id),LW=()=>S.words.find(x=>x.id===lc),next=()=>{const l=S.words.filter(w=>w.m==='l'&&w.id!==lc);if(l.length){if(lc){lh.push(lc);if(lh.length>100)lh.shift()}lc=shuf(l)[0].id}render()};
switch(a){
case'start':startSession(false);break;case'force':startSession(true);break;case'goW':tab='w';render();break;
case'back':ses=null;cur=null;render();break;
case'say':say(cur.w.w);break;case'slow':say(cur.w.w,.5);break;case'sp':spell(cur.w.w);break;
case'hint':{cur.hint++;const h=$('#hn');if(h)h.textContent='تلميح: '+cur.w.w.slice(0,(cur.lv===1?1:0)+cur.hint)+'…';break}
case'pk':{const k=cur.slots.indexOf(-1);if(k>=0){cur.slots[k]=+b.dataset.i;vQ()}break}
case'rm':if(!cur.res){cur.slots[+b.dataset.k]=-1;vQ()}break;
case'clr':cur.slots.fill(-1);vQ();break;
case'chk':{const c=cur,g=guessOf(c);if(c.lv===0&&c.slots.includes(-1))return toast('أكمل كل الحروف');if(!g.trim())return toast('اكتب الكلمة');
const w=c.w,ok=g===w.w,ms=Date.now()-c.t0;let r=1;if(ok){r=3;if(c.hint||ms>3e4)r=2;else if(c.lv>0&&ms<3500+1500*w.w.length)r=4}
c.guess=g;c.ok=ok;c.pr=shuf(PR)[0];c.gch=[...w.w].map((_,k)=>g[k]||'');c.res=[...w.w].map((x,k)=>g[k]===x?'ok':'bad');
if(!ok){const k=cls(w.w,g);S.err[k]=(S.err[k]||0)+1}
c.leech=grade(w,r);ok?ses.ok++:ses.bad++;
if(!ok&&!c.leech&&!ses.rt[w.id]){ses.rt[w.id]=1;ses.q.push(w.id)}
if(navigator.vibrate)navigator.vibrate(ok?30:[60,40,60]);say(w.w);vQ();break}
case'nx':ses.i++;nextQ();break;
case'lsay':say(LW().w);break;case'lslow':say(LW().w,.5);break;case'lsp':spell(LW().w);break;
case'lok':{const w=LW();w.k=(w.k||0)+1;if(w.k>=3){mv(w,'d');w.lc=0;toast('🎯 انتقلت إلى الإملاء')}else save();next();break}
case'lnx':next();break;
case'lprev':{let ok=false;while(lh.length){const id2=lh.pop();if(S.words.some(x=>x.id===id2&&x.m==='l')){lc=id2;ok=true;break}}if(ok)render();else toast('هذه أول بطاقة');break}
case'l2d':mv(LW(),'d');toast('🎯 انتقلت إلى الإملاء');next();break;
case'add':{const m=$('#nm').value,have=new Set(S.words.map(w=>w.w));
const ws=[...new Set($('#nw').value.split(/[\n,;،]+/).map(x=>x.trim().toLowerCase().replace(/[^a-z]/g,'')).filter(x=>x.length>1&&!have.has(x)))];
ws.forEach(w=>S.words.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),w,m,due:dn(),b:0,k:0}));save();toast(ws.length?`أُضيفت ${ws.length} كلمة`:'لا كلمات جديدة');vW();break}
case'wsay':say(W().w);break;
case'wmv':{const w=W();mv(w,w.m==='d'?'l':'d');vW();break}
case'wdel':S.words=S.words.filter(x=>x.id!==id);save();vW();break;
case'test':say('Hello, this is a test');break;
case'exp':{const j=JSON.stringify(S);if(NT()){navigator.clipboard.writeText(j).then(()=>toast('تم نسخ النسخة الاحتياطية – الصقها في ملاحظات'),()=>toast('تعذّر النسخ'));break}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));a.download='spellmaster-backup.json';a.click();break}
case'imp':if(NT()){const t=prompt('الصق النسخة الاحتياطية هنا');if(t)impT(t)}else $('#fi').click();break;
case'diag':{const T=NT();if(!T){toast('الفحص متاح داخل التطبيق فقط');break}T.getSupportedLanguages().then(r=>{const l=r.languages||[];$('#dg').textContent='اللغات الإنجليزية المتاحة: '+(l.filter(x=>/^en/i.test(x)).join(', ')||'لا توجد')+' — من أصل '+l.length}).catch(e=>{$('#dg').textContent='خطأ: '+errm(e)});break}
case'rst':if(confirm('مسح كل الكلمات والتقدّم؟')){S={words:[],streak:0,last:0,log:{},rate:.85,ret:.9,err:{}};save();render()}break}});
document.addEventListener('input',e=>{const t=e.target,i=t.id;
if(i==='rt'){S.rate=+t.value;save()}
else if(i==='rr'){S.ret=t.value/100;$('#rv').textContent=t.value+'%';save()}
else if(i==='ti'&&cur){cur.val=t.value.toLowerCase().replace(/[^a-z]/g,'');if(cur.lv===1)$('#sl').innerHTML=sh(chars(cur),null)}
else if(i==='cp'&&cur){const b=$('#nxb');if(b)b.disabled=t.value.trim().toLowerCase()!==cur.w.w}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='ti'){const b=document.querySelector('[data-a=chk]');b&&b.click()}if(e.target.id==='cp'){const b=$('#nxb');if(b&&!b.disabled)b.click()}});
function impT(t){try{const j=JSON.parse(t);if(!Array.isArray(j.words))throw 0;S=Object.assign(S,j);S.err=S.err||{};save();toast('تم الاستيراد');render()}catch(x){toast('نسخة غير صالحة')}}
$('#fi').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>impT(r.result);r.readAsText(f)});
pickVoice();render();
chkVoice();
</script>
</body>
</html>
