<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>SpellMaster – متقن الإملاء</title>
<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#1b1d2a;--mu:#6b7080;--pr:#4f46e5;--pr2:#7c3aed;--ok:#16a34a;--bad:#dc2626;--bd:#e3e5f0}
@media(prefers-color-scheme:dark){:root{--bg:#0f1020;--card:#1a1b30;--tx:#eef0ff;--mu:#9a9fc0;--bd:#2a2c4a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,"Segoe UI",Tahoma,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:auto}
header{padding:14px 20px;background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border-radius:0 0 22px 22px}
header h1{margin:0;font-size:21px}header small{opacity:.85}
main{flex:1;overflow:auto;padding:16px}
nav{display:flex;background:var(--card);border-top:1px solid var(--bd)}
nav button{flex:1;padding:8px 0;background:none;border:0;color:var(--mu);font:inherit;font-size:12px}
nav button.on{color:var(--pr);font-weight:700}nav b{display:block;font-size:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:12px}
.btn{border:0;border-radius:14px;padding:12px 16px;font:inherit;font-weight:700;background:var(--pr);color:#fff}
.btn.g{background:var(--card);color:var(--pr);border:1px solid var(--bd)}.btn.ok{background:var(--ok)}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
.slots,.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:ltr;margin:16px 0}
.slot,.tile{width:44px;height:52px;border-radius:12px;display:grid;place-items:center;font-size:24px;font-weight:700;padding:0}
.slot{border:2px dashed var(--bd)}.slot.f{border:2px solid var(--pr)}
.slot.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.slot.bad{background:var(--bad);color:#fff;border-color:var(--bad);animation:sh .4s}
.tile{background:var(--card);border:1px solid var(--bd);box-shadow:0 3px 0 var(--bd);color:var(--tx)}.tile:disabled{opacity:.15}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr);transition:width .3s}
.big{font-size:42px;font-weight:800;direction:ltr;text-align:center;letter-spacing:2px}
.fb{text-align:center;animation:pop .3s}.ltr{direction:ltr;text-align:left}.mu{color:var(--mu)}
textarea,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;z-index:9}
.tag{font-size:11px;padding:2px 8px;border-radius:9px;background:var(--bd);color:var(--mu)}
.w{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--bd)}.w b{flex:1;direction:ltr;text-align:left}
.ic{background:none;border:0;font-size:20px;padding:4px 8px}
</style>
</head>
<body>
<div id="app">
<header><h1>SpellMaster</h1><small>متقن الإملاء – يعمل بدون إنترنت</small></header>
<main id="main"></main>
<nav><button data-t="p"><b>🎯</b>تمرين</button><button data-t="l"><b>🧠</b>حفظ</button><button data-t="w"><b>📚</b>كلماتي</button><button data-t="m"><b>📊</b>إحصائيات</button></nav>
</div>
<input type="file" id="fi" accept=".json" hidden>
<script>
const $=s=>document.querySelector(s),dn=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5);
const INT=[1,2,4,7,14,30,60],PR=['أحسنت!','ممتاز!','رائع!','صحيح!','عمل جميل!'];
let S={words:[],streak:0,last:0,log:{},rate:.85};
try{Object.assign(S,JSON.parse(localStorage.getItem('sm1')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('sm1',JSON.stringify(S))}catch(e){}};
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let tab='p',ses=null,cur=null,lc=null,voice=null;
/* ---------- الصوت (صوت الهاتف المحلي – بدون إنترنت) ---------- */
function pickVoice(){try{const v=speechSynthesis.getVoices().filter(x=>/^en/i.test(x.lang));voice=v.find(x=>x.localService&&/en[-_]US/i.test(x.lang))||v.find(x=>x.localService)||v[0]||null}catch(e){}return voice}
try{speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function say(t,r){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=voice?voice.lang:'en-US';if(voice)u.voice=voice;u.rate=r||S.rate||.85;speechSynthesis.speak(u)}catch(e){}}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2200)}
async function getDef(w){if(w.d!==undefined)return w.d;if(!navigator.onLine)return null;try{const j=await(await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+w.w)).json(),m=j[0].meanings[0],df=m.definitions[0];w.d=m.partOfSpeech+': '+df.definition;w.e=df.example||'';save();return w.d}catch(e){return null}}
/* ---------- التكرار المتباعد ---------- */
function grade(w,ok){const n=dn();w.t=(w.t||0)+1;if(ok){w.ok=(w.ok||0)+1;w.b=Math.min((w.b||0)+1,INT.length);w.due=n+INT[w.b-1]}else{w.bad=(w.bad||0)+1;w.b=0;w.due=n+1}
S.log[n]=(S.log[n]||0)+1;if(S.last!==n){S.streak=S.last===n-1?S.streak+1:1;S.last=n}save()}
const M=h=>{$('#main').innerHTML=h},mv=(w,m)=>{w.m=m;w.due=dn();w.k=0;save()};
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));({p:vP,l:vL,w:vW,m:vM})[tab]()}
/* ---------- التمرين ---------- */
function vP(){if(cur)return vQ();if(ses&&ses.done)return vEnd();
const n=dn(),d=S.words.filter(w=>w.m==='d'),due=d.filter(w=>w.due<=n).length;
M(`${!pickVoice()?'<div class="card" style="border-color:var(--bad)">⚠️ لم أجد صوتاً إنجليزياً. ثبّت بيانات الصوت الإنجليزي من إعدادات الهاتف ← تحويل النص إلى كلام، ليعمل النطق بدون إنترنت.</div>':''}
<div class="card" style="text-align:center"><div class="tag">🔥 ${S.streak} يوم متتالي</div><div class="big" style="font-size:60px">${due}</div><p>${due?'كلمة مستحقة للمراجعة اليوم':d.length?'لا شيء مستحق اليوم 🎉':'لا توجد كلمات إملاء بعد'}</p>
<button class="btn" style="width:100%" data-a="${due?'start':d.length?'force':'goW'}">${due?'ابدأ التمرين':d.length?'تدرّب على أي حال':'أضف كلمات'}</button></div>`)}
function startSession(force){const n=dn();let q=S.words.filter(w=>w.m==='d'&&(force||w.due<=n));q=shuf(q).slice(0,20).map(w=>w.id);if(!q.length)return toast('لا توجد كلمات');ses={q,i:0,ok:0,bad:0,rt:{}};nextQ()}
function nextQ(){if(ses.i>=ses.q.length){cur=null;ses.done=1;return render()}
const w=S.words.find(x=>x.id===ses.q[ses.i]);if(!w){ses.i++;return nextQ()}
const L=[...w.w],ex=Math.max(2,Math.ceil(L.length/3)),ext=shuf([...'abcdefghijklmnopqrstuvwxyz'].filter(c=>!L.includes(c))).slice(0,ex);
cur={w,tiles:shuf([...L,...ext]).map(c=>({c})),slots:Array(L.length).fill(-1)};render();setTimeout(()=>say(w.w),250)}
function vQ(){const c=cur;
M(`<div class="bar"><i style="width:${ses.i/ses.q.length*100}%"></i></div><div class="card" style="margin-top:14px;text-align:center">
<div class="row"><button class="btn g" data-a="say">🔊 استمع</button><button class="btn g" data-a="slow">🐢 ببطء</button></div>
<div class="slots">${c.slots.map((s,k)=>`<div class="slot ${s<0?'':'f'} ${c.res?c.res[k]:''}" data-a="rm" data-k="${k}">${s<0?'':c.tiles[s].c}</div>`).join('')}</div>
<div class="tiles">${c.tiles.map((t,i)=>`<button class="tile" data-a="pk" data-i="${i}" ${c.slots.includes(i)||c.res?'disabled':''}>${t.c}</button>`).join('')}</div>
${c.res?`<div class="fb">${c.ok?`<h2 style="color:var(--ok)">✅ ${c.pr}</h2>`:`<h2 style="color:var(--bad)">❌ الصحيح:</h2><div class="big">${c.w.w}</div><p class="mu">كتبت: <span class="ltr">${c.guess}</span> — ستعود غداً</p>`}<button class="btn" style="width:100%" data-a="nx">التالي ›</button></div>`
:`<div class="row"><button class="btn g" data-a="clr">مسح</button><button class="btn" data-a="chk">تحقق ✓</button></div>`}</div>`)}
function vEnd(){M(`<div class="card fb"><h2>🏁 انتهت الجلسة</h2><p>✅ ${ses.ok} صحيحة · ❌ ${ses.bad} خاطئة</p><p class="mu">الأخطاء ستعود إليك غداً تلقائياً.</p><button class="btn" style="width:100%" data-a="back">رجوع</button></div>`)}
/* ---------- الحفظ ---------- */
function vL(){const l=S.words.filter(w=>w.m==='l');
if(!l.length)return M(`<div class="card" style="text-align:center">لا توجد كلمات للحفظ.<br><br><button class="btn" data-a="goW">أضف كلمات</button></div>`);
if(!l.find(w=>w.id===lc))lc=shuf(l)[0].id;const w=l.find(x=>x.id===lc);
M(`<div class="card" style="text-align:center"><span class="tag">${w.k||0}/3 ✓</span><div class="big" style="margin:18px 0">${w.w}</div><div id="df" class="mu ltr" style="min-height:44px"></div>
<div class="row"><button class="btn g" data-a="lsay">🔊 استمع</button><button class="btn g" data-a="lslow">🐢 ببطء</button></div><br>
<div class="row"><button class="btn ok" data-a="lok">حفظتها ✓</button><button class="btn g" data-a="lnx">التالي ›</button></div><br>
<button class="btn g" style="width:100%" data-a="l2d">انقلها إلى الإملاء الآن 🎯</button></div>`);
say(w.w);getDef(w).then(d=>{const e=$('#df');if(e&&d)e.textContent=d+(w.e?' — “'+w.e+'”':'')})}
/* ---------- الكلمات ---------- */
function vW(){M(`<div class="card"><textarea id="nw" rows="4" class="ltr" placeholder="الصق الكلمات: كلمة في كل سطر أو مفصولة بفواصل"></textarea>
<div class="row" style="margin-top:10px"><select id="nm"><option value="d">إملاء</option><option value="l">حفظ</option></select><button class="btn" data-a="add">إضافة</button></div></div>
<div class="card">${S.words.length?S.words.map(w=>`<div class="w"><b>${w.w}</b><span class="tag">${w.m==='l'?'حفظ':'إملاء · '+(w.b||0)}</span><button class="ic" data-a="wsay" data-id="${w.id}">🔊</button><button class="ic" data-a="wmv" data-id="${w.id}">⇄</button><button class="ic" data-a="wdel" data-id="${w.id}">🗑</button></div>`).join(''):'لا توجد كلمات بعد'}</div>`)}
function vM(){const n=dn(),d=S.words.filter(w=>w.m==='d'),t=d.reduce((a,w)=>a+(w.t||0),0),ok=d.reduce((a,w)=>a+(w.ok||0),0);pickVoice();
M(`<div class="card"><div class="row" style="text-align:center"><div><div class="big" style="font-size:28px">🔥${S.streak}</div>أيام</div><div><div class="big" style="font-size:28px">${S.log[n]||0}</div>اليوم</div><div><div class="big" style="font-size:28px">${t?Math.round(ok/t*100):0}%</div>الدقة</div></div></div>
<div class="card">الكلمات: ${S.words.length} (حفظ ${S.words.length-d.length} · إملاء ${d.length}) · مستحقة اليوم: ${d.filter(w=>w.due<=n).length}</div>
<div class="card"><b>الصوت:</b> ${voice?'✅ '+voice.name+(voice.localService?' (محلي – بدون إنترنت)':' ⚠️ قد يحتاج إنترنت'):'⚠️ لا يوجد صوت إنجليزي – ثبّته من إعدادات الهاتف ← تحويل النص إلى كلام'}<br><br>السرعة <input type="range" id="rt" min=".4" max="1.1" step=".05" value="${S.rate}"> <button class="btn g" data-a="test">جرّب</button></div>
<div class="card row"><button class="btn g" data-a="exp">تصدير</button><button class="btn g" data-a="imp">استيراد</button><button class="btn g" data-a="rst" style="color:var(--bad)">مسح الكل</button></div>`)}
/* ---------- الأحداث ---------- */
document.addEventListener('click',e=>{
const nb=e.target.closest('nav button');if(nb){tab=nb.dataset.t;return render()}
const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id,W=()=>S.words.find(x=>x.id===id),next=()=>{const l=S.words.filter(w=>w.m==='l'&&w.id!==lc);lc=l.length?shuf(l)[0].id:lc;render()};
switch(a){
case'start':startSession(false);break;case'force':startSession(true);break;case'goW':tab='w';render();break;
case'back':ses=null;cur=null;render();break;
case'say':say(cur.w.w);break;case'slow':say(cur.w.w,.5);break;
case'pk':{const k=cur.slots.indexOf(-1);if(k>=0){cur.slots[k]=+b.dataset.i;vQ()}break}
case'rm':if(!cur.res){cur.slots[+b.dataset.k]=-1;vQ()}break;
case'clr':cur.slots.fill(-1);vQ();break;
case'chk':{if(cur.slots.includes(-1))return toast('أكمل كل الحروف');
const g=cur.slots.map(i=>cur.tiles[i].c).join(''),ok=g===cur.w.w;cur.guess=g;cur.ok=ok;cur.pr=shuf(PR)[0];
cur.res=[...cur.w.w].map((c,k)=>g[k]===c?'ok':'bad');grade(cur.w,ok);ok?ses.ok++:ses.bad++;
if(!ok&&!ses.rt[cur.w.id]){ses.rt[cur.w.id]=1;ses.q.push(cur.w.id)}
if(navigator.vibrate)navigator.vibrate(ok?30:[60,40,60]);say(cur.w.w);vQ();break}
case'nx':ses.i++;nextQ();break;
case'lsay':say(W()?.w||S.words.find(x=>x.id===lc).w);break;
case'lslow':say(S.words.find(x=>x.id===lc).w,.5);break;
case'lok':{const w=S.words.find(x=>x.id===lc);w.k=(w.k||0)+1;if(w.k>=3){mv(w,'d');toast('🎯 انتقلت إلى الإملاء')}else save();next();break}
case'lnx':next();break;
case'l2d':mv(S.words.find(x=>x.id===lc),'d');toast('🎯 انتقلت إلى الإملاء');next();break;
case'add':{const m=$('#nm').value,have=new Set(S.words.map(w=>w.w));
const ws=[...new Set($('#nw').value.split(/[\n,;،]+/).map(x=>x.trim().toLowerCase().replace(/[^a-z]/g,'')).filter(x=>x.length>1&&!have.has(x)))];
ws.forEach(w=>S.words.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),w,m,due:dn(),b:0,k:0}));save();toast(ws.length?`أُضيفت ${ws.length} كلمة`:'لا كلمات جديدة');vW();break}
case'wsay':say(W().w);break;
case'wmv':{const w=W();mv(w,w.m==='d'?'l':'d');vW();break}
case'wdel':S.words=S.words.filter(x=>x.id!==id);save();vW();break;
case'test':say('Hello, this is a test');break;
case'exp':{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='spellmaster-backup.json';a.click();break}
case'imp':$('#fi').click();break;
case'rst':if(confirm('مسح كل الكلمات والتقدّم؟')){S={words:[],streak:0,last:0,log:{},rate:.85};save();render()}break}});
document.addEventListener('input',e=>{if(e.target.id==='rt'){S.rate=+e.target.value;save()}});
$('#fi').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!Array.isArray(j.words))throw 0;S=Object.assign(S,j);save();toast('تم الاستيراد');render()}catch(x){toast('ملف غير صالح')}};r.readAsText(f)});
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
pickVoice();render();
</script>
</body>
</html>
